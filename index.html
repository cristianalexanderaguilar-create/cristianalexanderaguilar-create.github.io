<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
min-height:100vh;
overflow-x:hidden;
font-family:'Poppins',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
color:white;
background:black;
}

/* VIDEO DE FONDO */

.bg-video{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
z-index:0;
}

/* CAPA OSCURA */

.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:
linear-gradient(
to bottom,
rgba(0,0,0,.35),
rgba(0,0,0,.75)
);
z-index:1;
}

/* CONTENEDOR */

.main-container{
position:relative;
z-index:2;
min-height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
}

/* ANIMACION DE ENTRADA */

@keyframes fadeUp{
from{
opacity:0;
transform:translateY(18px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.fade-in{
opacity:0;
animation:fadeUp .7s ease forwards;
}

.fade-in.d1{animation-delay:.05s;}
.fade-in.d2{animation-delay:.15s;}
.fade-in.d3{animation-delay:.25s;}
.fade-in.d4{animation-delay:.35s;}
.fade-in.d5{animation-delay:.45s;}

@media(prefers-reduced-motion:reduce){
.fade-in{
animation:none;
opacity:1;
}
}

/* FOTO */

.profile-pic{
width:140px;
height:140px;
border-radius:50%;
object-fit:cover;
border:2px solid rgba(255,255,255,.8);

box-shadow:
0 0 30px rgba(255,255,255,.15),
0 20px 40px rgba(0,0,0,.45);

margin-bottom:25px;
}

/* TITULOS */

.profile-title{
font-size:2.2rem;
font-weight:700;
letter-spacing:1px;
margin-bottom:8px;
}

.profile-subtitle{
color:#d9d9d9;
font-size:1rem;
margin-bottom:35px;
font-weight:300;
}

/* BOTONES */

.links-wrapper{
width:100%;
max-width:380px;
display:flex;
flex-direction:column;
gap:15px;
}

.btn-link{

display:flex;
justify-content:center;
align-items:center;
gap:10px;

width:100%;
padding:16px;

text-decoration:none;
color:white;

border-radius:14px;

background:rgba(255,255,255,.08);

border:1px solid rgba(255,255,255,.18);

backdrop-filter:blur(12px);
-webkit-backdrop-filter:blur(12px);

transition:all .3s ease;

font-size:1rem;
font-weight:600;
letter-spacing:.5px;
}

.btn-link svg{
width:20px;
height:20px;
flex-shrink:0;
}

.btn-link:hover{
transform:translateY(-3px);
box-shadow:0 15px 35px rgba(0,0,0,.35);
}

.btn-instagram:hover{
background:linear-gradient(45deg,#f58529,#dd2a7b,#8134af,#515bd4);
border-color:transparent;
}

.btn-tiktok:hover{
background:linear-gradient(90deg,#25f4ee33,#fe2c5533),rgba(255,255,255,.1);
border-color:#fe2c55;
}

.btn-youtube:hover{
background:rgba(255,0,0,.25);
border-color:#ff0000;
}

.btn-facebook:hover{
background:rgba(24,119,242,.3);
border-color:#1877f2;
}

/* FOOTER */

.footer{
margin-top:30px;
font-size:.8rem;
color:#bfbfbf;
opacity:.85;
}

/* RESPONSIVE */

@media(max-width:480px){

.profile-title{
font-size:1.8rem;
}

.profile-pic{
width:120px;
height:120px;
}

.btn-link{
padding:15px;
}
}

</style>
